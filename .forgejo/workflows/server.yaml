name: Ubuntu Server

on:
  push:
  workflow_dispatch:

jobs:
  build-server:
    runs-on: native-arm64
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Source checks
        run: ./scripts/check-source.sh

      - name: Fetch published platform assets when configured
        run: ./scripts/fetch-platform-assets.sh --if-configured

      - name: Check build environment
        run: ./build.sh server --check

      - name: Check SDK platform assets
        run: ./scripts/stage-sdk-assets.sh --check

      - name: Check staged updateEngine source
        run: ./build.sh update-engine --check

      - name: Build updateEngine package
        run: ./build.sh update-engine

      - name: Build server rootfs
        run: ./build.sh server

      - name: Verify server rootfs artifacts
        id: rootfs-artifacts
        run: ./scripts/export-rootfs-artifacts.sh

      - name: Upload server rootfs
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ steps.rootfs-artifacts.outputs.name }}-${{ github.run_id }}
          path: ${{ steps.rootfs-artifacts.outputs.paths }}
          if-no-files-found: error
          compression-level: 0

      - name: Build EROFS lower and OverlayFS boot artifacts
        run: ./build.sh overlay-root
