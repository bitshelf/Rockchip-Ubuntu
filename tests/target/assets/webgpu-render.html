<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>WEBGPU_RENDER_PROBE</title></head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
// Offline WebGPU render test: draw one triangle into a copyable texture,
// read it back and require red pixels. The adapter vendor is included so the
// same page can prove either the deterministic SwiftShader baseline or the
// unpinned ARM/Mali hardware path.
// The result is recorded in document.title for headless --dump-dom.
(async () => {
    const fail = (m) => { document.title = m; };
    try {
        const featureLevel = new URLSearchParams(location.search).get("featureLevel") === "compatibility" ? "compatibility" : "core";
        const adapter = await navigator.gpu.requestAdapter({featureLevel});
        if (!adapter) { fail("WEBGPU_RENDER_NO_ADAPTER"); return; }
        const info = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : {});
        const fallback = info.isFallbackAdapter ?? adapter.isFallbackAdapter ?? false;
        if (fallback) { fail("WEBGPU_RENDER_FALLBACK_ADAPTER"); return; }
        window.webgpuAdapter = { vendor: info.vendor, architecture: info.architecture,
            device: info.device, description: info.description, fallback };
        const device = await adapter.requestDevice();
        if (!device) { fail("WEBGPU_RENDER_NO_DEVICE"); return; }
        let vendor = "unknown";
        try {
            const info = adapter.info ||
                (adapter.requestAdapterInfo ?
                    await adapter.requestAdapterInfo() : null);
            vendor = (info && info.vendor) || "unknown";
        } catch (e) { vendor = "unavailable"; }
        const width = 64;
        const height = 64;
        const bytesPerRow = 256;
        const format = "rgba8unorm";
        const texture = device.createTexture({
            size: [width, height],
            format,
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
        });
        const shader = device.createShaderModule({ code: `
@vertex fn vs(@builtin(vertex_index) i : u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(0.0, 0.8), vec2f(-0.8, -0.8), vec2f(0.8, -0.8));
  return vec4f(p[i], 0.0, 1.0);
}
@fragment fn fs() -> @location(0) vec4f {
  return vec4f(1.0, 0.0, 0.0, 1.0);
}` });
        const pipeline = device.createRenderPipeline({
            layout: "auto",
            vertex: { module: shader },
            fragment: { module: shader, targets: [{ format }] },
        });
        const readback = device.createBuffer({
            size: bytesPerRow * height,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
        });
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
            colorAttachments: [{
                view: texture.createView(),
                loadOp: "clear",
                storeOp: "store",
                clearValue: { r: 0, g: 0, b: 0, a: 1 },
            }],
        });
        pass.setPipeline(pipeline);
        pass.draw(3);
        pass.end();
        encoder.copyTextureToBuffer(
            { texture },
            { buffer: readback, bytesPerRow, rowsPerImage: height },
            [width, height],
        );
        device.queue.submit([encoder.finish()]);
        await device.queue.onSubmittedWorkDone();
        await readback.mapAsync(GPUMapMode.READ);
        const pixels = new Uint8Array(readback.getMappedRange());
        let redPixels = 0;
        for (let y = 0; y < height; ++y) {
            for (let x = 0; x < width; ++x) {
                const i = y * bytesPerRow + x * 4;
                if (pixels[i] > 200 && pixels[i + 1] < 50 &&
                    pixels[i + 2] < 50 && pixels[i + 3] > 200) {
                    ++redPixels;
                }
            }
        }
        readback.unmap();
        if (redPixels === 0) { fail("WEBGPU_RENDER_NO_RED_PIXELS"); return; }
        const count = 256;
        const storage = device.createBuffer({size: count * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC});
        const computeReadback = device.createBuffer({size: count * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
        const computeShader = device.createShaderModule({code: `
@group(0) @binding(0) var<storage, read_write> output: array<u32>;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3u) {
  output[id.x] = id.x * 3u + 7u;
}`});
        const computePipeline = device.createComputePipeline({layout: "auto", compute: {module: computeShader, entryPoint: "main"}});
        const bindGroup = device.createBindGroup({layout: computePipeline.getBindGroupLayout(0), entries: [{binding: 0, resource: {buffer: storage}}]});
        const computeEncoder = device.createCommandEncoder();
        const computePass = computeEncoder.beginComputePass();
        computePass.setPipeline(computePipeline);
        computePass.setBindGroup(0, bindGroup);
        computePass.dispatchWorkgroups(count / 64);
        computePass.end();
        computeEncoder.copyBufferToBuffer(storage, 0, computeReadback, 0, count * 4);
        device.queue.submit([computeEncoder.finish()]);
        await computeReadback.mapAsync(GPUMapMode.READ);
        const values = new Uint32Array(computeReadback.getMappedRange());
        for (let i = 0; i < count; i++) {
            if (values[i] !== i * 3 + 7) { fail("WEBGPU_COMPUTE_MISMATCH " + i); return; }
        }
        computeReadback.unmap();
        // Exercise the browser's WebGPU canvas/shared-image presentation path
        // as well as rendering into an independent, copyable GPU texture.
        const canvas = document.getElementById("c");
        const context = canvas.getContext("webgpu");
        const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
        context.configure({device, format: canvasFormat, alphaMode: "opaque"});
        const canvasPipeline = device.createRenderPipeline({
            layout: "auto", vertex: {module: shader},
            fragment: {module: shader, targets: [{format: canvasFormat}]},
        });
        const canvasEncoder = device.createCommandEncoder();
        const canvasPass = canvasEncoder.beginRenderPass({colorAttachments: [{
            view: context.getCurrentTexture().createView(), loadOp: "clear",
            storeOp: "store", clearValue: {r: 0, g: 0, b: 0, a: 1},
        }]});
        canvasPass.setPipeline(canvasPipeline);
        canvasPass.draw(3);
        canvasPass.end();
        device.queue.submit([canvasEncoder.finish()]);
        await device.queue.onSubmittedWorkDone();
        await new Promise(requestAnimationFrame);
        await new Promise(requestAnimationFrame);
        window.webgpuResult = { adapter: window.webgpuAdapter, redPixels, width, height, featureLevel,
            coreFeaturesAndLimits: adapter.features.has("core-features-and-limits"), computeValuesChecked: count,
            canvasSubmitted: true };
        document.title = "WEBGPU_RENDER_OK vendor=" + vendor +
            " red_pixels=" + redPixels;
    } catch (e) {
        document.title = "WEBGPU_RENDER_ERROR " + (e && e.message ? e.message : e);
    }
})();
</script>
</body>
</html>
