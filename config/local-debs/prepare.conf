# Existing SDK packages copied into SDK_OUTPUT_DIR before platform assets are staged.
# Format: package name|destination directory
LOCAL_DEB_COPY_ENTRIES=(
    "librockchip-mpp-dev|mpp"
    "camera-engine-rkaiq|isp"
    "camera-engine-rkisp|isp"
)

# Board customizations may add data-only packages here. Sensor IQ is deliberately
# not part of the repository baseline.
# Format: package|architecture|source environment variable|installed-name
# environment variable|installed directory|output directory|description|validator
LOCAL_DATA_DEB_ENTRIES=()
