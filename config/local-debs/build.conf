# Local packages built by the repository through scripts/build-local-debs.sh.
# Format:
#   key|builder|source|patch directory|output directory|package filename globs|prepared SDK package names
LOCAL_DEB_BUILD_ENTRIES=(
    "rknpu2|debian-recipe|package/rknpu2||rknpu|librknnrt2_*_arm64.deb librknnrt-dev_*_arm64.deb rknn-server_*_arm64.deb rknn-models_*_all.deb|"
    "v4l-utils|ubuntu-source|v4l-utils|package/v4l-utils/patches|v4l|libv4l-0t64_*_arm64.deb libv4lconvert0t64_*_arm64.deb libv4l2rds0t64_*_arm64.deb v4l-utils_*_arm64.deb|"
    "libv4l-rkmpp|debian-recipe|package/libv4l-rkmpp||v4l|libv4l-rkmpp1_*_arm64.deb|librockchip-mpp-dev"
)
if [[ "${key:-}" == mesa-panvk || -s "${SDK_OUTPUT_DIR:-}/mesa-panvk/stage/SOURCE.json" ]]; then
    LOCAL_DEB_BUILD_ENTRIES+=("mesa-panvk|debian-recipe|package/mesa||mesa-panvk|mesa-panvk-experimental_*_arm64.deb|")
fi
