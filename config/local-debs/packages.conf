# Local SDK Debian packages carried into Ubuntu build inputs.
#
# Format:
#   SDK output relative file pattern|expected architecture|purpose
#
# The directory part must be literal. A filename pattern is allowed, but each
# entry must resolve to exactly one package. Package metadata and checksums are
# recorded when the platform assets are staged.

DEB_ENTRIES=(
    "linux-headers/*_arm64.deb|arm64|kernel-headers"
    "libmali/libmali-*_arm64.deb|arm64|gpu-runtime"
    "rga/librga2_*_arm64.deb|arm64|rga-runtime"
    "rga/librga-dev_*_arm64.deb|arm64|rga-development"
    "mpp/librockchip-mpp1_*_arm64.deb|arm64|mpp-runtime"
    "mpp/librockchip-vpu0_*_arm64.deb|arm64|mpp-vpu-runtime"
    "mpp/rockchip-mpp-demos_*_arm64.deb|arm64|mpp-qa-tools"
    "v4l/libv4l-0t64_*_arm64.deb|arm64|v4l-runtime"
    "v4l/libv4lconvert0t64_*_arm64.deb|arm64|v4l-convert-runtime"
    "v4l/libv4l2rds0t64_*_arm64.deb|arm64|v4l-rds-runtime"
    "v4l/v4l-utils_*_arm64.deb|arm64|v4l-tools"
    "v4l/libv4l-rkmpp1_*_arm64.deb|arm64|v4l-rkmpp-runtime"
    "isp/camera_engine_rkaiq_*_arm64.deb|arm64|rkaiq-runtime"
    "isp/camera_engine_rkisp_*_arm64.deb|arm64|rkisp-legacy-runtime"
    "gstreamer/gstreamer1.0-rockchip1_*_arm64.deb|arm64|gstreamer-rkmpp-runtime"
)
