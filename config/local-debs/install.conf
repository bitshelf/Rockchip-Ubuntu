# Local packages and integration files installed into the image.
LOCAL_DEB_INSTALL_PURPOSES=(
    rknpu-runtime
    rknpu-tools
    rknpu-models
    v4l-runtime
    v4l-convert-runtime
    v4l-rds-runtime
    v4l-tools
    v4l-rkmpp-runtime
    rkaiq-runtime
    rkisp-legacy-runtime
    gstreamer-rkmpp-runtime
)
LOCAL_DEB_HOLD_PURPOSES=(
    rknpu-runtime
    rknpu-tools
    rknpu-models
    v4l-runtime
    v4l-convert-runtime
    v4l-rds-runtime
    v4l-tools
    v4l-rkmpp-runtime
    rkaiq-runtime
    rkisp-legacy-runtime
    gstreamer-rkmpp-runtime
)

# Format: repository source|absolute target in rootfs|mode
LOCAL_DEB_FILE_ENTRIES=(
    "config/udev/61-rockchip-rga.rules|/usr/lib/udev/rules.d/61-rockchip-rga.rules|0644"
    "tests/target/test-alsa-utils.sh|/usr/libexec/ubuntu-alsa-cli-qa|0755"
    "tests/target/test-audio-real.sh|/usr/libexec/ubuntu-audio-real-qa|0755"
    "tests/target/test-rknpu.sh|/usr/libexec/ubuntu-rknpu-qa|0755"
    "package/libv4l-rkmpp/runtime/rkmpp-video-nodes.service|/usr/lib/systemd/system/rkmpp-video-nodes.service|0644"
    "tests/target/test-v4l2.sh|/usr/libexec/ubuntu-v4l2-qa|0755"
    "package/isp/rkaiq_3A.service.d/ubuntu.conf|/etc/systemd/system/rkaiq_3A.service.d/ubuntu.conf|0644"
    "package/isp/rockchip-rkaiq-ready|/usr/libexec/rockchip-rkaiq-ready|0755"
    "tests/target/test-isp-camera.sh|/usr/libexec/ubuntu-isp-camera-qa|0755"
    "tests/target/test-isp-3a-service.sh|/usr/libexec/ubuntu-isp-3a-service-qa|0755"
    "tests/target/test-gstreamer-rkmpp.sh|/usr/libexec/ubuntu-gstreamer-rkmpp-qa|0755"
    "tests/target/test-kernel-diagnostics.sh|/usr/libexec/ubuntu-kernel-diagnostics-qa|0755"
    "tests/target/test-kernel-reset.py|/usr/libexec/ubuntu-kernel-reset-qa|0755"
    "tests/target/test-kernel-log-allowlist.sh|/usr/libexec/ubuntu-kernel-log-qa|0755"
    "tests/target/test-rt-cyclictest.sh|/usr/libexec/ubuntu-rt-cyclictest-qa|0755"
    "config/kernel/rk3576-kernel-errors.allow|/usr/share/ubuntu-hardware-qa/rk3576-kernel-errors.allow|0644"
)
LOCAL_DEB_DESKTOP_FILE_ENTRIES=(
    "config/desktop/61-mutter-rockchip.rules|/usr/lib/udev/rules.d/61-mutter-rockchip.rules|0644"
    "tests/target/test-gpu-headless-egl.sh|/usr/libexec/ubuntu-gpu-headless-egl-qa|0755"
    "tests/target/headless-egl.py|/usr/libexec/headless-egl.py|0755"
    "tests/target/test-rime-engine.py|/usr/libexec/ubuntu-rime-engine-qa|0755"
    "tests/target/test-gnome-rime-input.py|/usr/libexec/ubuntu-gnome-rime-input-qa|0755"
    "tests/target/test-gnome.sh|/usr/libexec/ubuntu-gnome-qa|0755"
    "tests/target/test-chromium-mpp.sh|/usr/libexec/ubuntu-chromium-mpp-qa|0755"
    "tests/target/test-webgpu-vulkan.sh|/usr/libexec/ubuntu-webgpu-vulkan-qa|0755"
    "tests/target/assets/webgpu-render.html|/usr/share/ubuntu-hardware-qa/webgpu-render.html|0644"
    "tests/target/test-bluetooth.sh|/usr/libexec/ubuntu-bluetooth-qa|0755"
)
LOCAL_DEB_DESKTOP_OPTIONAL_INSTALL_PURPOSES=(panvk-experimental-runtime)
LOCAL_DEB_ENABLE_SERVICES=(rknn-server.service rkmpp-video-nodes.service rkaiq_3A.service)
LOCAL_DEB_DISABLE_SERVICES=(rkisp_3A.service)

# Format: file or glob|path. Globs are evaluated below the target rootfs.
LOCAL_DEB_REQUIRED_ENTRIES=(
    "file|/usr/libexec/ubuntu-alsa-cli-qa"
    "file|/usr/libexec/ubuntu-audio-real-qa"
    "file|/usr/lib/aarch64-linux-gnu/librknnrt.so"
    "file|/usr/bin/rknn_common_test"
    "file|/usr/bin/rknn_server"
    "glob|/usr/share/model/*/mobilenet_v1.rknn"
    "file|/usr/share/model/dog_224x224.jpg"
    "file|/usr/libexec/ubuntu-rknpu-qa"
    "file|/usr/bin/v4l2-ctl"
    "glob|/usr/lib/aarch64-linux-gnu/libv4l/plugins/libv4l-rkmpp.so"
    "file|/usr/libexec/ubuntu-v4l2-qa"
    "file|/usr/bin/rkaiq_3A_server"
    "file|/usr/libexec/rockchip-rkaiq-ready"
    "file|/usr/bin/rkisp_3A_server"
    "file|/usr/libexec/ubuntu-isp-camera-qa"
    "file|/usr/libexec/ubuntu-isp-3a-service-qa"
    "file|/usr/bin/gst-launch-1.0"
    "glob|/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so"
    "file|/usr/libexec/ubuntu-gstreamer-rkmpp-qa"
    "file|/usr/libexec/ubuntu-kernel-diagnostics-qa"
    "file|/usr/libexec/ubuntu-kernel-reset-qa"
    "file|/usr/libexec/ubuntu-kernel-log-qa"
    "file|/usr/libexec/ubuntu-rt-cyclictest-qa"
    "file|/usr/share/ubuntu-hardware-qa/rk3576-kernel-errors.allow"
)
LOCAL_DEB_DESKTOP_REQUIRED_ENTRIES=(
    "file|/usr/libexec/ubuntu-rime-engine-qa"
    "file|/usr/libexec/ubuntu-gnome-rime-input-qa"
    "file|/usr/share/gnome-shell/extensions/kimpanel@kde.org/metadata.json"
    # Repository-built ARM64 browser carries the RKMPP device adapter.
    "executable|/usr/bin/chromium"
    "file|/usr/libexec/ubuntu-gnome-qa"
    "file|/usr/libexec/ubuntu-chromium-mpp-qa"
    "file|/usr/libexec/ubuntu-webgpu-vulkan-qa"
    "file|/usr/share/ubuntu-hardware-qa/webgpu-render.html"
    "file|/usr/libexec/ubuntu-bluetooth-qa"
)

LOCAL_DEB_DESKTOP_INSTALL_PURPOSES=(chromium-runtime gnome-input-panel)
LOCAL_DEB_DESKTOP_HOLD_PURPOSES=(chromium-runtime gnome-input-panel)
