# Local packages and integration files installed into the image.
LOCAL_DEB_INSTALL_PURPOSES=(
    v4l-runtime
    v4l-convert-runtime
    v4l-rds-runtime
    v4l-tools
    v4l-rkmpp-runtime
)
LOCAL_DEB_HOLD_PURPOSES=(
    v4l-runtime
    v4l-convert-runtime
    v4l-rds-runtime
    v4l-tools
    v4l-rkmpp-runtime
)

# Format: repository source|absolute target in rootfs|mode
LOCAL_DEB_FILE_ENTRIES=(
    "package/libv4l-rkmpp/runtime/rkmpp-video-nodes.service|/usr/lib/systemd/system/rkmpp-video-nodes.service|0644"
    "tests/target/test-v4l2.sh|/usr/libexec/ubuntu-v4l2-qa|0755"
)
LOCAL_DEB_ENABLE_SERVICES=(rkmpp-video-nodes.service)
LOCAL_DEB_DISABLE_SERVICES=()

# Format: file or glob|path. Globs are evaluated below the target rootfs.
LOCAL_DEB_REQUIRED_ENTRIES=(
    "file|/usr/bin/v4l2-ctl"
    "glob|/usr/lib/aarch64-linux-gnu/libv4l/plugins/libv4l-rkmpp.so"
    "file|/usr/libexec/ubuntu-v4l2-qa"
)
