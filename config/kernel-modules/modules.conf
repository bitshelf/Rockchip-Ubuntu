# Additional SDK kernel modules carried into Ubuntu images.
#
# Format:
#   SDK module path|lib/modules install subdirectory|module to autoload
#
# This is a product feature selection, not a SoC module inventory. Keep the
# list intentionally small; unrelated SDK modules must not enter the bundle.

MODULE_ENTRIES=(
    "drivers/net/wireless/rockchip_wlan/rkwifi/bcmdhd/bcmdhd.ko|kernel/drivers/net/wireless/rockchip|bcmdhd"
    "drivers/usb/serial/ch341.ko|kernel/drivers/usb/serial|"
)
