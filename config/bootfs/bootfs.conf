# Board-specific boot filesystem policy. Keep hardware names here so the
# reusable builder does not encode a SoC or board filename.
BOOTFS_SIZE_MB=256
BOOTFS_LABEL=bootfs
BOOTFS_BASE_DTB=myd-lr3576.dtb
BOOTFS_INSTALLED_DTB=board.dtb
BOOTFS_TIMEOUT=30
BOOTFS_CMDLINE="root=PARTLABEL=rootfs rootfstype=erofs rootwait ro"

# All staged DTBO files are copied into /overlays for later selection. Only
# names listed here are enabled in extlinux.conf. The base bootfs enables none.
BOOTFS_ENABLED_OVERLAYS=()
