# WirePlumber 0.5 (resolute): name Rockchip platform ALSA cards after their
# kernel longnames so desktop audio panels match `aplay -l` instead of three
# indistinguishable "Built-in Audio" entries.
#
# Loaded from /usr/share/wireplumber/wireplumber.conf.d/ after the stock ALSA
# monitor configuration (filename order 51- > 50-).  Rules run after the
# "Built-in Audio" fallback in prepareDevice(), so the device.description set
# here wins.  The rules also serve as the fallback layer if UCM2 matching ever
# fails: they key on api.alsa.card.longname, which alsa-udev sets
# independently of UCM.  The "~" prefix marks the value as a regex.

monitor.alsa.rules = [
  {
    # These UCM profiles provide stereo HDMI/DP. ACP otherwise probes the
    # Pro Audio profile at the controller's maximum channel count, which
    # can exceed the attached receiver's speaker allocation.
    matches = [ { api.alsa.card.longname = "~rockchip-(hdmi[0-9]*|dp[0-9]*)" } ]
    actions = { update-props = { api.acp.pro-channels = 2 } }
  }
  {
    matches = [ { api.alsa.card.longname = "~rockchip-hdmi" } ]
    actions = { update-props = { device.description = "HDMI (rockchip-hdmi)" } }
  }
  {
    matches = [ { api.alsa.card.longname = "~rockchip-dp0" } ]
    actions = { update-props = { device.description = "DisplayPort (rockchip-dp0)" } }
  }
  {
    matches = [ { api.alsa.card.longname = "~rockchip-es8388" } ]
    actions = { update-props = { device.description = "ES8388 (rockchip-es8388)" } }
  }
  {
    matches = [ { api.alsa.card.longname = "rockchip-es8390" } ]
    actions = { update-props = { device.description = "ES8389 (rockchip-es8390)" } }
  }
]
