# Fcitx5 session environment for the GNOME Wayland session (seeded by the
# Ubuntu image build).  im-config wires X11 sessions; GNOME overrides
# im-config, so the same values are published through systemd
# environment.d, which GDM applies on first login (fcitx-im.org official
# setup values, identical to im-config's 23_fcitx5.rc).
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
