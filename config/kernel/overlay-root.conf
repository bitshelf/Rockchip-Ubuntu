# Early boot and device discovery
CONFIG_BLK_DEV_INITRD=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# Immutable lower filesystem; keep it uncompressed for the vendor 6.1 kernel.
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_XATTR=y
CONFIG_EROFS_FS_POSIX_ACL=y
CONFIG_EROFS_FS_SECURITY=y
# CONFIG_EROFS_FS_ZIP is not set

# Persistent userdata upper filesystem
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y

# Whole-root copy-up. These must be built in because the switch happens before
# the real rootfs is available.
CONFIG_OVERLAY_FS=y
# CONFIG_OVERLAY_FS_REDIRECT_DIR is not set
# CONFIG_OVERLAY_FS_INDEX is not set

CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# Rockchip NPU runtime. DRM GEM is optional because older supported SoCs may
# expose the legacy /dev/rknpu node instead of a DRM render node.
CONFIG_ROCKCHIP_RKNPU=y
