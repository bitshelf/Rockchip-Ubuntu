name: Ubuntu flashable images

on:
  push:
    branches: [ubuntu26]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ${{ vars.ARM64_RUNNER_LABEL || 'ubuntu-24.04-arm' }}
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        variant: [server, desktop, desktop-xfce]
    env:
      CLEAN_CI_WORK: yes
      BUILD_OUTPUT_DIR: ${{ github.workspace }}/build/${{ matrix.variant }}
      BUILD_INPUTS_URL: ${{ vars.BUILD_INPUTS_URL }}
      BUILD_INPUTS_SHA256: ${{ vars.BUILD_INPUTS_SHA256 }}
      BUILD_INPUTS_AUTH_HEADER: ${{ secrets.BUILD_INPUTS_AUTH_HEADER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-notes.py --tag "$GITHUB_REF_NAME" --validate-only

      - name: Install native rootfs build prerequisites
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends snapd distro-info-data ubuntu-keyring e2fsprogs erofs-utils initramfs-tools device-tree-compiler gdisk dosfstools rsync git curl wget jq zstd openssl dpkg-dev fakeroot file gzip kmod make gcc g++ libc6-dev libbz2-dev libcurl4-openssl-dev patch python3 util-linux libglib2.0-bin
          sudo -n snap install ubuntu-image --classic

      - name: Source checks
        run: sudo -n unshare --mount --propagation private ./scripts/check-source.sh

      - name: Download verified artifacts directory
        run: python3 scripts/build-inputs.py fetch --inputs "$RUNNER_TEMP/ubuntu-inputs-${{ github.run_id }}-${{ matrix.variant }}"

      - name: Build native ARM64 filesystem images
        run: python3 scripts/build-inputs.py build --inputs "$RUNNER_TEMP/ubuntu-inputs-${{ github.run_id }}-${{ matrix.variant }}" --output "$BUILD_OUTPUT_DIR" --variant ${{ matrix.variant }}

      - name: Bind exported images to the binary input bundle
        run: printf '%s\n' "$BUILD_INPUTS_SHA256" > "artifacts/${{ matrix.variant }}/BUILD_INPUTS_SHA256"

      - name: Export verified filesystem artifacts
        id: rootfs-artifacts
        run: ROOTFS_VARIANT=${{ matrix.variant }} ROOTFS_INCLUDE_FILESYSTEM_IMAGES=yes ./scripts/export-rootfs-artifacts.sh

      - name: Upload ARM64 filesystem artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.variant }}-${{ github.run_id }}
          path: artifacts/${{ matrix.variant }}/
          if-no-files-found: error
          compression-level: 1

  pack-firmware:
    needs: build-rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [server, desktop, desktop-xfce]
    env:
      BUILD_INPUTS_URL: ${{ vars.BUILD_INPUTS_URL }}
      BUILD_INPUTS_SHA256: ${{ vars.BUILD_INPUTS_SHA256 }}
      BUILD_INPUTS_AUTH_HEADER: ${{ secrets.BUILD_INPUTS_AUTH_HEADER }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK packaging prerequisites
        run: sudo -n apt-get update && sudo -n apt-get install -y erofs-utils e2fsprogs zstd curl
      - name: Download verified external SDK inputs
        run: python3 scripts/build-inputs.py fetch --inputs "$RUNNER_TEMP/pack-inputs"
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-${{ matrix.variant }}-${{ github.run_id }}
          path: artifacts/${{ matrix.variant }}
      - name: Pack complete flashable SDK image
        run: |
          test "$(cat artifacts/${{ matrix.variant }}/BUILD_INPUTS_SHA256)" = "$BUILD_INPUTS_SHA256"
          test -s "artifacts/${{ matrix.variant }}/packages.manifest"
          python3 scripts/pack-firmware.py pack --inputs "$RUNNER_TEMP/pack-inputs/firmware" --images "artifacts/${{ matrix.variant }}" --output "$RUNNER_TEMP/release/ubuntu-26.04-${{ matrix.variant }}-update.img"
          rm -- "$RUNNER_TEMP/release/ubuntu-26.04-${{ matrix.variant }}-update.img"
      - uses: actions/upload-artifact@v4
        with:
          name: flashable-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0

  publish-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack-firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flashable-*-${{ github.run_id }}
          path: release
          merge-multiple: true
      - name: Publish complete images to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          INPUT_SHA256: ${{ vars.BUILD_INPUTS_SHA256 }}
        run: |
          tag="$GITHUB_REF_NAME"
          python3 scripts/release-notes.py --tag "$tag" --repository "$GH_REPO" --commit "$SOURCE_COMMIT" --inputs-sha256 "$INPUT_SHA256" --output release-notes.md
          args=("$tag" --repo "$GH_REPO" --verify-tag --title "$tag" --generate-notes --notes-file release-notes.md)
          [[ "$tag" != *-* ]] || args+=(--prerelease)
          gh release create "${args[@]}" release/*
